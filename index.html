<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Transcription Helper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 1rem;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #444;
      text-transform: uppercase;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* --- Upload zone --- */
    .upload {
      background: #1a1a1a;
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 1.4rem 1.5rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .upload:hover        { border-color: #555; background: #1d1d1d; }
    .upload.drag         { border-color: #f59e0b; background: #1f1a10; }
    .upload.loaded       { border-style: solid; border-color: #252525; }
    .upload input {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .up-title {
      font-size: 0.95rem; font-weight: 600; color: #ccc;
      margin-bottom: 0.2rem; word-break: break-all;
      pointer-events: none;
    }
    .up-sub { font-size: 0.8rem; color: #555; pointer-events: none; }

    /* --- Player --- */
    .player {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 1.25rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    .player.show { display: flex; }

    /* Seek bar */
    .seek-wrap { position: relative; padding: 7px 0; }

    .seek {
      -webkit-appearance: none;
      appearance: none;
      width: 100%; height: 5px;
      border-radius: 3px;
      background: #2a2a2a;
      cursor: pointer; outline: none;
      display: block;
    }
    .seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px; height: 17px;
      border-radius: 50%; background: #ddd; cursor: pointer;
    }
    .seek::-moz-range-thumb {
      width: 17px; height: 17px;
      border-radius: 50%; background: #ddd;
      border: none; cursor: pointer;
    }

    /* Seek bar pips */
    .pip {
      position: absolute;
      top: 50%; transform: translate(-50%, -50%);
      width: 3px; height: 17px;
      border-radius: 2px;
      pointer-events: none; display: none;
    }
    .pip.show { display: block; }
    .pip-start { background: #f59e0b; }
    .pip-end   { background: #818cf8; }

    .times {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: #555;
      font-variant-numeric: tabular-nums;
      margin-top: -0.5rem;
    }

    /* Transport */
    .transport {
      display: flex; justify-content: center;
      align-items: center; gap: 0.5rem;
    }
    .skip {
      background: none; border: 1px solid #282828;
      color: #666; border-radius: 8px;
      padding: 0.5rem 0.75rem; font-size: 0.82rem;
      cursor: pointer; transition: color .15s, border-color .15s;
      min-height: 38px;
    }
    .skip:hover { color: #aaa; border-color: #3a3a3a; }
    .nudge {
      background: none; border: 1px solid #222;
      color: #4a4a4a; border-radius: 8px;
      padding: 0.4rem 0.6rem; font-size: 0.75rem;
      cursor: pointer; transition: color .15s, border-color .15s;
      min-height: 34px;
    }
    .nudge:hover { color: #999; border-color: #333; }

    .play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: #ddd; color: #111; border: none;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s;
    }
    .play-btn:hover  { transform: scale(1.06); }
    .play-btn:active { transform: scale(0.93); }

    /* --- Action buttons --- */
    .actions { display: flex; flex-direction: column; gap: 0.6rem; }

    .btn-row { display: flex; gap: 0.6rem; align-items: stretch; }

    .btn-big {
      border: none; border-radius: 14px;
      font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: transform .1s, filter .15s;
    }
    .btn-big:active:not(:disabled) { transform: scale(0.97); }
    .btn-big:hover:not(:disabled)  { filter: brightness(1.1); }
    .btn-big:disabled { opacity: 0.28; cursor: default; }

    .btn-set {
      background: #f59e0b; color: #111;
      flex: 1; min-height: 56px; font-size: 0.82rem;
      flex-direction: column; gap: 0.1rem;
    }
    .btn-end {
      background: #818cf8; color: #fff;
      flex: 1; min-height: 56px; font-size: 0.82rem;
      flex-direction: column; gap: 0.1rem;
    }
    .btn-time {
      font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0; text-transform: none;
      font-variant-numeric: tabular-nums;
      opacity: 0.75; min-height: 1em;
    }
    .btn-resume {
      background: #22c55e; color: #fff;
      width: 100%; min-height: 72px; font-size: 1rem;
    }

    .btn-set.flash, .btn-end.flash { animation: flash .4s ease-out; }
    @keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }

    .hints {
      font-size: 0.72rem; color: #333;
      text-align: center; letter-spacing: 0.03em;
    }

    audio { display: none; }
  </style>
</head>
<body>

<h1>Transcription Helper</h1>

<div class="wrap">
  <div class="upload" id="upload">
    <input type="file" id="fileInput" accept="audio/*">
    <div class="up-title" id="upTitle">Tap to upload audio</div>
    <div class="up-sub"   id="upSub">or drag and drop a file</div>
  </div>

  <div class="player" id="player">
    <div class="seek-wrap">
      <input type="range" class="seek" id="seek" min="0" max="1" step="any" value="0">
      <div class="pip pip-start" id="pip"></div>
      <div class="pip pip-end"   id="pipEnd"></div>
    </div>
    <div class="times">
      <span id="tCur">0:00</span>
      <span id="tDur">0:00</span>
    </div>
    <div class="transport">
      <button class="skip"  id="back">&#9664; 5s</button>
      <button class="nudge" id="nudgeBack">&#9664; 1s</button>
      <button class="play-btn" id="playBtn">&#9654;</button>
      <button class="nudge" id="nudgeFwd">1s &#9654;</button>
      <button class="skip"  id="fwd">5s &#9654;</button>
    </div>
  </div>

  <div class="actions">
    <div class="btn-row">
      <button class="btn-big btn-set" id="btnSet" disabled>
        <span>&#9679; Set Start</span>
        <span class="btn-time" id="startTime"></span>
      </button>
      <button class="btn-big btn-end" id="btnEnd" disabled>
        <span>&#9679; Set End</span>
        <span class="btn-time" id="endTime"></span>
      </button>
    </div>
    <button class="btn-big btn-resume" id="btnResume" disabled>&#9654; Resume from Point</button>
  </div>
  <p class="hints">Space &nbsp;resume/pause &nbsp;·&nbsp; S &nbsp;set start &nbsp;·&nbsp; E &nbsp;set end &nbsp;·&nbsp; R &nbsp;resume &nbsp;·&nbsp; &#8592;&#8594; &nbsp;nudge 1s</p>
</div>

<audio id="audio"></audio>

<script>
'use strict';

// ── IndexedDB helpers ────────────────────────────────────────────────────────
const DB_NAME  = 'startplayback';
const DB_STORE = 'clips';

function dbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}

async function dbSave(blob, name) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put({ blob, name }, 'clip');
    tx.oncomplete = res;
    tx.onerror    = e => rej(e.target.error);
  });
}

async function dbLoad() {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const r = db.transaction(DB_STORE, 'readonly')
                .objectStore(DB_STORE).get('clip');
    r.onsuccess = e => res(e.target.result ?? null);
    r.onerror   = e => rej(e.target.error);
  });
}

// ── Elements ─────────────────────────────────────────────────────────────────
const upload   = document.getElementById('upload');
const fileIn   = document.getElementById('fileInput');
const upTitle  = document.getElementById('upTitle');
const upSub    = document.getElementById('upSub');
const player   = document.getElementById('player');
const seekEl   = document.getElementById('seek');
const pip      = document.getElementById('pip');
const pipEnd   = document.getElementById('pipEnd');
const tCur     = document.getElementById('tCur');
const tDur     = document.getElementById('tDur');
const playBtn   = document.getElementById('playBtn');
const back      = document.getElementById('back');
const fwd       = document.getElementById('fwd');
const nudgeBack = document.getElementById('nudgeBack');
const nudgeFwd  = document.getElementById('nudgeFwd');
const btnSet    = document.getElementById('btnSet');
const btnEnd    = document.getElementById('btnEnd');
const btnResume = document.getElementById('btnResume');
const startTime = document.getElementById('startTime');
const endTime   = document.getElementById('endTime');
const audio    = document.getElementById('audio');

let startPt = null;   // seconds | null
let endPt   = null;   // seconds | null
let blobURL = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(t) {
  if (!isFinite(t) || t < 0) return '0:00';
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
}

// ── Load a clip into the UI ───────────────────────────────────────────────────
function showClip(blob, name) {
  if (blobURL) URL.revokeObjectURL(blobURL);
  blobURL = URL.createObjectURL(blob);
  audio.src = blobURL;
  upTitle.textContent = name;
  upSub.textContent   = 'Tap to replace';
  upload.classList.add('loaded');
  player.classList.add('show');
  btnSet.disabled = false;
  btnEnd.disabled = false;
}

// ── Start point management ────────────────────────────────────────────────────
function applyStart(t) {
  startPt = t;
  startTime.textContent = t !== null ? fmt(t) : '';
  if (t !== null) {
    localStorage.setItem('startPt', t);
    btnResume.disabled = false;
    placePip();
    if (endPt !== null && t >= endPt) applyEnd(null);
    updateEndBtnState();
  } else {
    localStorage.removeItem('startPt');
    btnResume.disabled = true;
    pip.classList.remove('show');
  }
}

function placePip() {
  if (startPt === null || !isFinite(audio.duration) || audio.duration === 0) return;
  pip.style.left = `${(startPt / audio.duration) * 100}%`;
  pip.classList.add('show');
}

function updateEndBtnState() {
  btnEnd.disabled = startPt !== null && audio.currentTime < startPt;
}

// ── End point management ──────────────────────────────────────────────────────
function applyEnd(t) {
  endPt = t;
  endTime.textContent = t !== null ? fmt(t) : '';
  if (t !== null) {
    localStorage.setItem('endPt', t);
    placeEndPip();
  } else {
    localStorage.removeItem('endPt');
    pipEnd.classList.remove('show');
  }
}

function placeEndPip() {
  if (endPt === null || !isFinite(audio.duration) || audio.duration === 0) return;
  pipEnd.style.left = `${(endPt / audio.duration) * 100}%`;
  pipEnd.classList.add('show');
}

// ── File input ────────────────────────────────────────────────────────────────
fileIn.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  showClip(f, f.name);
  applyStart(null);
  applyEnd(null);
  dbSave(f, f.name);
});

// ── Drag and drop ─────────────────────────────────────────────────────────────
upload.addEventListener('dragover',  e => { e.preventDefault(); upload.classList.add('drag'); });
upload.addEventListener('dragleave', e => {
  if (!upload.contains(e.relatedTarget)) upload.classList.remove('drag');
});
upload.addEventListener('drop', e => {
  e.preventDefault();
  upload.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (!f?.type.startsWith('audio/')) return;
  showClip(f, f.name);
  applyStart(null);
  applyEnd(null);
  dbSave(f, f.name);
});

// ── Audio events ──────────────────────────────────────────────────────────────
audio.addEventListener('loadedmetadata', () => {
  seekEl.max      = audio.duration;
  tDur.textContent = fmt(audio.duration);
  const savedStart = localStorage.getItem('startPt');
  if (savedStart !== null) applyStart(parseFloat(savedStart));
  const savedEnd = localStorage.getItem('endPt');
  if (savedEnd !== null) applyEnd(parseFloat(savedEnd));
});

audio.addEventListener('timeupdate', () => {
  seekEl.value    = audio.currentTime;
  tCur.textContent = fmt(audio.currentTime);
  updateEndBtnState();
  if (endPt !== null && !audio.paused && audio.currentTime >= endPt) {
    audio.pause();
  }
});

audio.addEventListener('play',  () => {
  playBtn.innerHTML = '&#9646;&#9646;';
  btnResume.innerHTML = '&#9646;&#9646; Pause';
});
audio.addEventListener('pause', () => {
  playBtn.innerHTML = '&#9654;';
  btnResume.innerHTML = '&#9654; Resume from Point';
});
audio.addEventListener('ended', () => {
  playBtn.innerHTML = '&#9654;';
  btnResume.innerHTML = '&#9654; Resume from Point';
});

// ── Seek bar ──────────────────────────────────────────────────────────────────
seekEl.addEventListener('input', () => { audio.currentTime = +seekEl.value; updateEndBtnState(); });

// ── Transport ─────────────────────────────────────────────────────────────────
function nudge(delta) {
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
}

playBtn.addEventListener('click',   () => audio.paused ? audio.play() : audio.pause());
back.addEventListener('click',      () => nudge(-5));
fwd.addEventListener('click',       () => nudge(+5));
nudgeBack.addEventListener('click', () => nudge(-1));
nudgeFwd.addEventListener('click',  () => nudge(+1));

// ── Action buttons ────────────────────────────────────────────────────────────
btnSet.addEventListener('click', () => {
  applyStart(audio.currentTime);
  btnSet.classList.remove('flash');
  void btnSet.offsetWidth;
  btnSet.classList.add('flash');
});

btnEnd.addEventListener('click', () => {
  applyEnd(audio.currentTime);
  btnEnd.classList.remove('flash');
  void btnEnd.offsetWidth;
  btnEnd.classList.add('flash');
});

function resumeOrPause() {
  if (audio.paused) {
    if (startPt !== null) audio.currentTime = startPt;
    audio.play();
  } else {
    audio.pause();
  }
}

btnResume.addEventListener('click', resumeOrPause);


// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      resumeOrPause();
      break;
    case 'KeyS':
      if (!btnSet.disabled) {
        applyStart(audio.currentTime);
        btnSet.classList.remove('flash');
        void btnSet.offsetWidth;
        btnSet.classList.add('flash');
      }
      break;
    case 'KeyE':
      if (!btnEnd.disabled) {
        applyEnd(audio.currentTime);
        btnEnd.classList.remove('flash');
        void btnEnd.offsetWidth;
        btnEnd.classList.add('flash');
      }
      break;
    case 'KeyR':
      if (!btnResume.disabled) btnResume.click();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      nudge(-1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      nudge(+1);
      break;
  }
});

// ── Init: restore from IndexedDB ──────────────────────────────────────────────
(async () => {
  const clip = await dbLoad();
  if (clip) showClip(clip.blob, clip.name);
  // start point is restored in the loadedmetadata handler
})();
</script>
</body>
</html>
