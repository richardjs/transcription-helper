<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Transcription Helper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 1rem;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #444;
      text-transform: uppercase;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* --- Source picker tabs --- */
    .source-tabs {
      display: flex;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      border-radius: 9px;
      padding: 0.55rem 0;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #555;
      cursor: pointer;
      transition: color .15s, background .15s;
    }
    .tab.active { background: #2a2a2a; color: #ddd; }
    .tab:hover:not(.active) { color: #888; }

    /* --- Upload zone --- */
    .upload {
      background: #1a1a1a;
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 1.4rem 1.5rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .upload:hover        { border-color: #555; background: #1d1d1d; }
    .upload.drag         { border-color: #f59e0b; background: #1f1a10; }
    .upload.loaded       { border-style: solid; border-color: #252525; }
    .upload input {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .up-title {
      font-size: 0.95rem; font-weight: 600; color: #ccc;
      margin-bottom: 0.2rem; word-break: break-all;
      pointer-events: none;
    }
    .up-sub { font-size: 0.8rem; color: #555; pointer-events: none; }

    /* --- YouTube URL input --- */
    .yt-zone {
      background: #1a1a1a;
      border: 2px solid #252525;
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      display: none;
      flex-direction: column;
      gap: 0.6rem;
    }
    .yt-zone.show { display: flex; }
    .yt-zone label { font-size: 0.82rem; color: #666; }
    .yt-input-row { display: flex; gap: 0.5rem; }
    .yt-input {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #ddd;
      font-size: 0.88rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color .15s;
    }
    .yt-input:focus { border-color: #f00; }
    .yt-load {
      background: #c00;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .yt-load:hover { background: #e00; }
    .yt-error { font-size: 0.78rem; color: #f87171; display: none; }
    .yt-error.show { display: block; }
    .yt-title { font-size: 0.88rem; color: #aaa; display: none; word-break: break-word; }
    .yt-title.show { display: block; }

    /* --- YouTube embed container --- */
    .yt-embed {
      border-radius: 12px;
      overflow: hidden;
      display: none;
      background: #000;
      aspect-ratio: 16/9;
    }
    .yt-embed.show { display: block; }
    .yt-embed iframe { width: 100%; height: 100%; display: block; border: none; }

    /* --- Player --- */
    .player {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 1.25rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    .player.show { display: flex; }

    /* Seek bar */
    .seek-wrap { position: relative; padding: 7px 0; }

    .seek {
      -webkit-appearance: none;
      appearance: none;
      width: 100%; height: 5px;
      border-radius: 3px;
      background: #2a2a2a;
      cursor: pointer; outline: none;
      display: block;
    }
    .seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px; height: 17px;
      border-radius: 50%; background: #ddd; cursor: pointer;
    }
    .seek::-moz-range-thumb {
      width: 17px; height: 17px;
      border-radius: 50%; background: #ddd;
      border: none; cursor: pointer;
    }

    /* Seek bar pips */
    .pip {
      position: absolute;
      top: 50%; transform: translate(-50%, -50%);
      width: 3px; height: 17px;
      border-radius: 2px;
      pointer-events: none; display: none;
    }
    .pip.show { display: block; }
    .pip-start { background: #f59e0b; }
    .pip-end   { background: #818cf8; }

    .times {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: #555;
      font-variant-numeric: tabular-nums;
      margin-top: -0.5rem;
    }

    /* Transport */
    .transport {
      display: flex; justify-content: center;
      align-items: center; gap: 0.5rem;
    }
    .skip {
      background: none; border: 1px solid #282828;
      color: #666; border-radius: 8px;
      padding: 0.5rem 0.75rem; font-size: 0.82rem;
      cursor: pointer; transition: color .15s, border-color .15s;
      min-height: 38px;
    }
    .skip:hover { color: #aaa; border-color: #3a3a3a; }
    .nudge {
      background: none; border: 1px solid #222;
      color: #4a4a4a; border-radius: 8px;
      padding: 0.4rem 0.6rem; font-size: 0.75rem;
      cursor: pointer; transition: color .15s, border-color .15s;
      min-height: 34px;
    }
    .nudge:hover { color: #999; border-color: #333; }

    .play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: #ddd; color: #111; border: none;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s;
    }
    .play-btn:hover  { transform: scale(1.06); }
    .play-btn:active { transform: scale(0.93); }

    /* --- Action buttons --- */
    .actions { display: flex; flex-direction: column; gap: 0.6rem; }

    .btn-row { display: flex; gap: 0.6rem; align-items: stretch; }

    .btn-big {
      border: none; border-radius: 14px;
      font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: transform .1s, filter .15s;
    }
    .btn-big:active:not(:disabled) { transform: scale(0.97); }
    .btn-big:hover:not(:disabled)  { filter: brightness(1.1); }
    .btn-big:disabled { opacity: 0.28; cursor: default; }

    .btn-set {
      background: #f59e0b; color: #111;
      flex: 1; min-height: 56px; font-size: 0.82rem;
      flex-direction: column; gap: 0.1rem;
    }
    .btn-end {
      background: #818cf8; color: #fff;
      flex: 1; min-height: 56px; font-size: 0.82rem;
      flex-direction: column; gap: 0.1rem;
    }
    .btn-time {
      font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0; text-transform: none;
      font-variant-numeric: tabular-nums;
      opacity: 0.75; min-height: 1em;
    }
    .btn-resume {
      background: #22c55e; color: #fff;
      width: 100%; min-height: 220px; font-size: 1rem;
    }

    .speed-row {
      display: flex; gap: 0.4rem;
    }
    .btn-speed {
      flex: 1; background: none; border: 1px solid #222;
      color: #555; border-radius: 10px;
      padding: 0.55rem 0; font-size: 0.85rem;
      cursor: pointer; transition: color .15s, border-color .15s, background .15s;
    }
    .btn-speed:hover { color: #aaa; border-color: #3a3a3a; }
    .btn-speed.active { background: #2a2a2a; color: #ddd; border-color: #3a3a3a; }

    .btn-set.flash, .btn-end.flash { animation: flash .4s ease-out; }
    @keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }

    .hints {
      font-size: 0.72rem; color: #333;
      text-align: center; letter-spacing: 0.03em;
    }

    audio { display: none; }
  </style>
</head>
<body>

<h1>Transcription Helper</h1>

<div class="wrap">
  <!-- Source mode tabs -->
  <div class="source-tabs">
    <button class="tab active" id="tabFile">&#128190; Audio File</button>
    <button class="tab"        id="tabYT">&#9654; YouTube</button>
  </div>

  <!-- File upload zone -->
  <div class="upload" id="upload">
    <input type="file" id="fileInput" accept="audio/*">
    <div class="up-title" id="upTitle">Tap to upload audio</div>
    <div class="up-sub"   id="upSub">or drag and drop a file</div>
  </div>

  <!-- YouTube URL zone -->
  <div class="yt-zone" id="ytZone">
    <label>YouTube URL or video ID</label>
    <div class="yt-input-row">
      <input type="text" class="yt-input" id="ytInput" placeholder="https://youtube.com/watch?v=…">
      <button class="yt-load" id="ytLoad">Load</button>
    </div>
    <div class="yt-error" id="ytError">Couldn't find a valid YouTube video ID.</div>
    <div class="yt-title" id="ytTitle"></div>
  </div>

  <!-- YouTube embed -->
  <div class="yt-embed" id="ytEmbed"></div>

  <!-- Transport player (shared) -->
  <div class="player" id="player">
    <div class="seek-wrap">
      <input type="range" class="seek" id="seek" min="0" max="1" step="any" value="0">
      <div class="pip pip-start" id="pip"></div>
      <div class="pip pip-end"   id="pipEnd"></div>
    </div>
    <div class="times">
      <span id="tCur">0:00</span>
      <span id="tDur">0:00</span>
    </div>
    <div class="transport">
      <button class="skip"  id="back">&#9664; 5s</button>
      <button class="nudge" id="nudgeBack">&#9664; 1s</button>
      <button class="play-btn" id="playBtn">&#9654;</button>
      <button class="nudge" id="nudgeFwd">1s &#9654;</button>
      <button class="skip"  id="fwd">5s &#9654;</button>
    </div>
  </div>

  <div class="actions">
    <div class="btn-row">
      <button class="btn-big btn-set" id="btnSet" disabled>
        <span>&#9679; Set Start</span>
        <span class="btn-time" id="startTime"></span>
      </button>
      <button class="btn-big btn-end" id="btnEnd" disabled>
        <span>&#9679; Set End</span>
        <span class="btn-time" id="endTime"></span>
      </button>
    </div>
    <button class="btn-big btn-resume" id="btnResume" disabled>&#9654; Resume from Point</button>
    <div class="speed-row">
      <button class="btn-speed" data-rate="0.5">0.5×</button>
      <button class="btn-speed" data-rate="0.75">0.75×</button>
      <button class="btn-speed active" data-rate="1">1×</button>
    </div>
  </div>
  <p class="hints">Space &nbsp;resume/pause &nbsp;·&nbsp; S &nbsp;set start &nbsp;·&nbsp; E &nbsp;set end &nbsp;·&nbsp; R &nbsp;resume &nbsp;·&nbsp; &#8592;&#8594; &nbsp;nudge 1s</p>
</div>

<audio id="audio"></audio>

<script>
'use strict';

// ── IndexedDB helpers ────────────────────────────────────────────────────────
const DB_NAME  = 'startplayback';
const DB_STORE = 'clips';

function dbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}

async function dbSave(blob, name) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put({ blob, name }, 'clip');
    tx.oncomplete = res;
    tx.onerror    = e => rej(e.target.error);
  });
}

async function dbLoad() {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const r = db.transaction(DB_STORE, 'readonly')
                .objectStore(DB_STORE).get('clip');
    r.onsuccess = e => res(e.target.result ?? null);
    r.onerror   = e => rej(e.target.error);
  });
}

// ── YouTube video ID extraction ──────────────────────────────────────────────
function extractYtId(raw) {
  const s = raw.trim();
  // bare ID (11 chars, word chars + dash)
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
    return u.searchParams.get('v');
  } catch {
    return null;
  }
}

// ── Elements ─────────────────────────────────────────────────────────────────
const tabFile   = document.getElementById('tabFile');
const tabYT     = document.getElementById('tabYT');
const upload    = document.getElementById('upload');
const fileIn    = document.getElementById('fileInput');
const upTitle   = document.getElementById('upTitle');
const upSub     = document.getElementById('upSub');
const ytZone    = document.getElementById('ytZone');
const ytInput   = document.getElementById('ytInput');
const ytLoad    = document.getElementById('ytLoad');
const ytError   = document.getElementById('ytError');
const ytTitleEl = document.getElementById('ytTitle');
const ytEmbed   = document.getElementById('ytEmbed');
const player    = document.getElementById('player');
const seekEl    = document.getElementById('seek');
const pip       = document.getElementById('pip');
const pipEnd    = document.getElementById('pipEnd');
const tCur      = document.getElementById('tCur');
const tDur      = document.getElementById('tDur');
const playBtn   = document.getElementById('playBtn');
const back      = document.getElementById('back');
const fwd       = document.getElementById('fwd');
const nudgeBack = document.getElementById('nudgeBack');
const nudgeFwd  = document.getElementById('nudgeFwd');
const btnSet    = document.getElementById('btnSet');
const btnEnd    = document.getElementById('btnEnd');
const btnResume = document.getElementById('btnResume');
const startTime = document.getElementById('startTime');
const endTime   = document.getElementById('endTime');
const audio     = document.getElementById('audio');

// ── State ─────────────────────────────────────────────────────────────────────
let startPt  = null;
let endPt    = null;
let blobURL  = null;
let mode     = 'file';   // 'file' | 'yt'
let ytPlayer = null;     // YouTube IFrame player instance
let ytReady  = false;
let ytDur    = 0;
let pollId   = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(t) {
  if (!isFinite(t) || t < 0) return '0:00';
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
}

function currentTime() {
  return mode === 'yt' && ytPlayer ? (ytPlayer.getCurrentTime?.() ?? 0) : audio.currentTime;
}

function duration() {
  return mode === 'yt' ? ytDur : audio.duration;
}

function isPaused() {
  if (mode === 'yt') {
    if (!ytPlayer) return true;
    const s = ytPlayer.getPlayerState?.();
    return s !== 1; // 1 = playing
  }
  return audio.paused;
}

// ── Seek bar pips ─────────────────────────────────────────────────────────────
function placePip() {
  const dur = duration();
  if (startPt === null || !isFinite(dur) || dur === 0) return;
  pip.style.left = `${(startPt / dur) * 100}%`;
  pip.classList.add('show');
}

function placeEndPip() {
  const dur = duration();
  if (endPt === null || !isFinite(dur) || dur === 0) return;
  pipEnd.style.left = `${(endPt / dur) * 100}%`;
  pipEnd.classList.add('show');
}

function updateEndBtnState() {
  btnEnd.disabled = startPt !== null && currentTime() < startPt;
}

// ── Start / end point management ──────────────────────────────────────────────
function applyStart(t) {
  startPt = t;
  startTime.textContent = t !== null ? fmt(t) : '';
  if (t !== null) {
    localStorage.setItem('startPt', t);
    btnResume.disabled = false;
    placePip();
    if (endPt !== null && t >= endPt) applyEnd(null);
    updateEndBtnState();
  } else {
    localStorage.removeItem('startPt');
    btnResume.disabled = true;
    pip.classList.remove('show');
  }
}

function applyEnd(t) {
  endPt = t;
  endTime.textContent = t !== null ? fmt(t) : '';
  if (t !== null) {
    localStorage.setItem('endPt', t);
    placeEndPip();
  } else {
    localStorage.removeItem('endPt');
    pipEnd.classList.remove('show');
  }
}

// ── Unified seek / play / pause / nudge ───────────────────────────────────────
function seekTo(t) {
  if (mode === 'yt' && ytPlayer) {
    ytPlayer.seekTo(t, true);
  } else {
    audio.currentTime = t;
  }
  updateEndBtnState();
}

function playMedia() {
  if (mode === 'yt' && ytPlayer) ytPlayer.playVideo();
  else audio.play();
}

function pauseMedia() {
  if (mode === 'yt' && ytPlayer) ytPlayer.pauseVideo();
  else audio.pause();
}

function nudge(delta) {
  const dur = duration();
  seekTo(Math.max(0, Math.min(dur || 0, currentTime() + delta)));
}

function setRate(rate) {
  if (mode === 'yt' && ytPlayer) ytPlayer.setPlaybackRate(rate);
  else audio.playbackRate = rate;
}

// ── Play / pause UI sync ──────────────────────────────────────────────────────
function syncPlayUI(playing) {
  playBtn.innerHTML  = playing ? '&#9646;&#9646;' : '&#9654;';
  btnResume.innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Resume from Point';
}

// ── Local file loading ────────────────────────────────────────────────────────
function showClip(blob, name) {
  if (blobURL) URL.revokeObjectURL(blobURL);
  blobURL = URL.createObjectURL(blob);
  audio.src = blobURL;
  upTitle.textContent = name;
  upSub.textContent   = 'Tap to replace';
  upload.classList.add('loaded');
  player.classList.add('show');
  btnSet.disabled = false;
  btnEnd.disabled = false;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(newMode) {
  mode = newMode;
  tabFile.classList.toggle('active', newMode === 'file');
  tabYT.classList.toggle('active',   newMode === 'yt');
  upload.style.display  = newMode === 'file' ? '' : 'none';
  ytZone.classList.toggle('show',  newMode === 'yt');
  ytEmbed.classList.toggle('show', newMode === 'yt' && ytReady);

  // Reset start/end when switching source
  applyStart(null);
  applyEnd(null);
  player.classList.remove('show');
  syncPlayUI(false);
  stopPoll();

  if (newMode === 'file') {
    pauseMedia();
    ytReady = false;
    localStorage.removeItem('ytVideoId');
  }
  if (newMode === 'yt') {
    audio.pause();
    audio.src = '';
  }
}

tabFile.addEventListener('click', () => switchTab('file'));
tabYT.addEventListener('click',   () => switchTab('yt'));

// ── File input ────────────────────────────────────────────────────────────────
fileIn.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  showClip(f, f.name);
  applyStart(null);
  applyEnd(null);
  dbSave(f, f.name);
});

// ── Drag and drop ─────────────────────────────────────────────────────────────
upload.addEventListener('dragover',  e => { e.preventDefault(); upload.classList.add('drag'); });
upload.addEventListener('dragleave', e => {
  if (!upload.contains(e.relatedTarget)) upload.classList.remove('drag');
});
upload.addEventListener('drop', e => {
  e.preventDefault();
  upload.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (!f?.type.startsWith('audio/')) return;
  showClip(f, f.name);
  applyStart(null);
  applyEnd(null);
  dbSave(f, f.name);
});

// ── Audio events ──────────────────────────────────────────────────────────────
audio.addEventListener('loadedmetadata', () => {
  seekEl.max       = audio.duration;
  tDur.textContent = fmt(audio.duration);
  const savedStart = localStorage.getItem('startPt');
  if (savedStart !== null) applyStart(parseFloat(savedStart));
  const savedEnd = localStorage.getItem('endPt');
  if (savedEnd !== null) applyEnd(parseFloat(savedEnd));
});

audio.addEventListener('timeupdate', () => {
  if (mode !== 'file') return;
  seekEl.value     = audio.currentTime;
  tCur.textContent = fmt(audio.currentTime);
  updateEndBtnState();
  if (endPt !== null && !audio.paused && audio.currentTime >= endPt) audio.pause();
});

audio.addEventListener('play',  () => { if (mode === 'file') syncPlayUI(true); });
audio.addEventListener('pause', () => { if (mode === 'file') syncPlayUI(false); });
audio.addEventListener('ended', () => { if (mode === 'file') syncPlayUI(false); });

// ── YouTube IFrame API ────────────────────────────────────────────────────────
function loadYtApi() {
  if (window.YT || document.getElementById('yt-api-script')) return;
  const s = document.createElement('script');
  s.id  = 'yt-api-script';
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}

window.onYouTubeIframeAPIReady = function () {
  window._ytApiReady = true;
};

function startPoll() {
  if (pollId) return;
  pollId = setInterval(ytPoll, 100);
}

function stopPoll() {
  if (pollId) { clearInterval(pollId); pollId = null; }
}

function ytPoll() {
  if (!ytPlayer || !ytReady) return;
  const t   = ytPlayer.getCurrentTime?.() ?? 0;
  const dur = ytPlayer.getDuration?.()    ?? 0;
  ytDur = dur;

  seekEl.max       = dur;
  seekEl.value     = t;
  tCur.textContent = fmt(t);
  tDur.textContent = fmt(dur);
  updateEndBtnState();

  const state = ytPlayer.getPlayerState?.();
  syncPlayUI(state === 1);

  if (endPt !== null && state === 1 && t >= endPt) {
    ytPlayer.pauseVideo();
  }
}

function loadYtVideo(videoId) {
  ytError.classList.remove('show');
  localStorage.setItem('ytVideoId', videoId);

  // Inject embed div fresh each time so YT player re-initialises cleanly
  ytEmbed.innerHTML = '<div id="yt-player-div"></div>';
  ytEmbed.classList.add('show');

  function createPlayer() {
    ytReady = false;
    ytPlayer = new YT.Player('yt-player-div', {
      videoId,
      playerVars: { rel: 0, modestbranding: 1 },
      events: {
        onReady(e) {
          ytReady = true;
          ytDur   = e.target.getDuration();
          seekEl.max       = ytDur;
          tDur.textContent = fmt(ytDur);
          player.classList.add('show');
          btnSet.disabled = false;
          btnEnd.disabled = false;
          startPoll();
          ytTitleEl.textContent = '';
          ytTitleEl.classList.remove('show');
          const savedStart = localStorage.getItem('startPt');
          if (savedStart !== null) applyStart(parseFloat(savedStart));
          const savedEnd = localStorage.getItem('endPt');
          if (savedEnd !== null) applyEnd(parseFloat(savedEnd));
        },
        onStateChange(e) {
          syncPlayUI(e.data === YT.PlayerState.PLAYING);
        },
        onError() {
          ytError.textContent = 'YouTube could not load this video (may be restricted).';
          ytError.classList.add('show');
          ytEmbed.classList.remove('show');
          stopPoll();
        },
      },
    });
  }

  if (window.YT?.Player) {
    createPlayer();
  } else {
    loadYtApi();
    const wait = setInterval(() => {
      if (window._ytApiReady) { clearInterval(wait); createPlayer(); }
    }, 100);
  }
}

ytLoad.addEventListener('click', () => {
  const id = extractYtId(ytInput.value);
  if (!id) {
    ytError.textContent = "Couldn't find a valid YouTube video ID.";
    ytError.classList.add('show');
    return;
  }
  applyStart(null);
  applyEnd(null);
  player.classList.remove('show');
  stopPoll();
  loadYtVideo(id);
});

ytInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') ytLoad.click();
});

// ── Seek bar ──────────────────────────────────────────────────────────────────
seekEl.addEventListener('input', () => {
  seekTo(+seekEl.value);
  tCur.textContent = fmt(+seekEl.value);
});

// ── Transport ─────────────────────────────────────────────────────────────────
playBtn.addEventListener('click',   () => isPaused() ? playMedia() : pauseMedia());
back.addEventListener('click',      () => nudge(-5));
fwd.addEventListener('click',       () => nudge(+5));
nudgeBack.addEventListener('click', () => nudge(-1));
nudgeFwd.addEventListener('click',  () => nudge(+1));

// ── Action buttons ────────────────────────────────────────────────────────────
btnSet.addEventListener('click', () => {
  applyStart(currentTime());
  btnSet.classList.remove('flash');
  void btnSet.offsetWidth;
  btnSet.classList.add('flash');
});

btnEnd.addEventListener('click', () => {
  applyEnd(currentTime());
  btnEnd.classList.remove('flash');
  void btnEnd.offsetWidth;
  btnEnd.classList.add('flash');
});

function resumeOrPause() {
  if (isPaused()) {
    if (startPt !== null) seekTo(startPt);
    playMedia();
  } else {
    pauseMedia();
  }
}

btnResume.addEventListener('click', resumeOrPause);

document.querySelectorAll('.btn-speed').forEach(btn => {
  btn.addEventListener('click', () => {
    setRate(parseFloat(btn.dataset.rate));
    document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    btn.blur();
  });
});

document.addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') e.target.blur();
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      resumeOrPause();
      break;
    case 'KeyS':
      if (!btnSet.disabled) {
        applyStart(currentTime());
        btnSet.classList.remove('flash');
        void btnSet.offsetWidth;
        btnSet.classList.add('flash');
      }
      break;
    case 'KeyE':
      if (!btnEnd.disabled) {
        applyEnd(currentTime());
        btnEnd.classList.remove('flash');
        void btnEnd.offsetWidth;
        btnEnd.classList.add('flash');
      }
      break;
    case 'KeyR':
      if (!btnResume.disabled) btnResume.click();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      nudge(-1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      nudge(+1);
      break;
  }
});

// ── Init: restore from localStorage / IndexedDB ───────────────────────────────
(async () => {
  const ytId = localStorage.getItem('ytVideoId');
  if (ytId) {
    // Manually switch to YouTube tab without calling applyStart/applyEnd,
    // so saved start/end points survive until onReady restores them.
    mode = 'yt';
    tabFile.classList.remove('active');
    tabYT.classList.add('active');
    upload.style.display = 'none';
    ytZone.classList.add('show');
    ytInput.value = ytId;
    audio.src = '';
    loadYtVideo(ytId);
  } else {
    const clip = await dbLoad();
    if (clip) showClip(clip.blob, clip.name);
    // start/end points restored in loadedmetadata handler
  }
})();
</script>
</body>
</html>
